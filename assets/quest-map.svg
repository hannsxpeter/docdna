<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">docdna quest map</title>
  <desc id="d">Three levels. 1 Survey: decide what the project owes. 2 Backfill: write the documents the code can prove. 3 Check: re-verify claims against the code in CI.</desc>
  <style>
    .sans{font-family:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
  </style>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="10" fill="#0E141B" stroke="#243140"/>
  <path d="M1 44H1199V11a10 10 0 0 0-10-10H11A10 10 0 0 0 1 11Z" fill="#162029"/>
  <line x1="1" y1="44" x2="1199" y2="44" stroke="#243140"/>
  <text x="32" y="28" class="mono" font-size="13" font-weight="700" fill="#F0B429" letter-spacing="1.5">QUEST MAP</text>
  <text x="1168" y="28" class="mono" font-size="13" fill="#7F91A3" text-anchor="end">SURVEY TO CHECK  3 LEVELS</text>
  <path d="M220 230H980" fill="none" stroke="#F0B429" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round"/>

  <g transform="translate(48 84)">
    <rect width="340" height="280" rx="4" fill="#162029" stroke="#F0B429"/>
    <text x="24" y="54" class="mono" font-size="38" font-weight="700" fill="#F0B429">01</text>
    <text x="24" y="96" class="sans" font-size="28" font-weight="700" fill="#E8F0F7">Survey</text>
    <text x="24" y="124" class="sans" font-size="14" fill="#7F91A3">Scout the repo. Zero questions.</text>
    <line x1="24" y1="144" x2="316" y2="144" stroke="#243140"/>
    <text x="24" y="172" class="mono" font-size="11" fill="#7F91A3" letter-spacing="1.5">CLEAR IT WITH</text>
    <text x="24" y="200" class="mono" font-size="15" font-weight="700" fill="#E8F0F7">survey the documentation</text>
    <text x="24" y="224" class="mono" font-size="15" font-weight="700" fill="#E8F0F7">docdna_select.py</text>
    <line x1="24" y1="244" x2="316" y2="244" stroke="#243140"/>
    <text x="24" y="268" class="sans" font-size="13" fill="#7F91A3">Reward: DOCDNA.md + manifest</text>
    <rect x="252" y="24" width="64" height="22" rx="3" fill="#F0B429"/>
    <text x="284" y="39" class="mono" font-size="12" font-weight="700" fill="#0E141B" text-anchor="middle" letter-spacing="1.5">START</text>
  </g>

  <g transform="translate(430 84)">
    <rect width="340" height="280" rx="4" fill="#162029" stroke="#243140"/>
    <text x="24" y="54" class="mono" font-size="38" font-weight="700" fill="#F0B429">02</text>
    <text x="24" y="96" class="sans" font-size="28" font-weight="700" fill="#E8F0F7">Backfill</text>
    <text x="24" y="124" class="sans" font-size="14" fill="#7F91A3">Write what the code can prove.</text>
    <line x1="24" y1="144" x2="316" y2="144" stroke="#243140"/>
    <text x="24" y="172" class="mono" font-size="11" fill="#7F91A3" letter-spacing="1.5">CLEAR IT WITH</text>
    <text x="24" y="200" class="mono" font-size="15" font-weight="700" fill="#E8F0F7">write the config reference</text>
    <text x="24" y="224" class="mono" font-size="15" font-weight="700" fill="#E8F0F7">docdna_backfill.py</text>
    <line x1="24" y1="244" x2="316" y2="244" stroke="#243140"/>
    <text x="24" y="268" class="sans" font-size="13" fill="#7F91A3">Reward: cited docs, max five</text>
  </g>

  <g transform="translate(812 84)">
    <rect width="340" height="280" rx="4" fill="#162029" stroke="#243140"/>
    <text x="24" y="54" class="mono" font-size="38" font-weight="700" fill="#F0B429">03</text>
    <text x="24" y="96" class="sans" font-size="28" font-weight="700" fill="#E8F0F7">Check</text>
    <text x="24" y="124" class="sans" font-size="14" fill="#7F91A3">Boss fight: docs vs code.</text>
    <line x1="24" y1="144" x2="316" y2="144" stroke="#243140"/>
    <text x="24" y="172" class="mono" font-size="11" fill="#7F91A3" letter-spacing="1.5">CLEAR IT WITH</text>
    <text x="24" y="200" class="mono" font-size="15" font-weight="700" fill="#E8F0F7">check the docs against code</text>
    <text x="24" y="224" class="mono" font-size="15" font-weight="700" fill="#E8F0F7">docdna_check.py</text>
    <line x1="24" y1="244" x2="316" y2="244" stroke="#243140"/>
    <text x="24" y="268" class="sans" font-size="13" fill="#7F91A3">Reward: CI gate + tripwires</text>
